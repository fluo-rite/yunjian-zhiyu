[project]
name = "server"
version = "0.1.0"
description = "FastAPI backend for the Yunjian Zhiyu project."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
