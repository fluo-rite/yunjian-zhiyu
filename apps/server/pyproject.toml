[project]
name = "server"
version = "0.1.0"
description = "FastAPI backend for the Yunjian Zhiyu project."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "arq>=0.26.3",
    "dashscope>=1.24.0",
    "email-validator>=2.0.0",
    "langgraph>=0.4.7",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=1.0.1",
    "mcp>=1.13.1",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.2.9",
    "pypdf>=5.5.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.10.1",
    "redis>=5.2.1,<6",
    "sqlalchemy>=2.0.36",
    "sse-starlette>=2.1.3",
]

[dependency-groups]
dev = [
    "alembic>=1.14.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
